# Local development. Not a production setup: the API runs in debug mode and
# MongoDB has no authentication, which is acceptable only because both ports
# are bound to 127.0.0.1.
#
#   docker compose up -d --wait          the API and MongoDB
#   docker compose up -d --wait mongo    MongoDB only (API and tests on the host)
services:
  api:
    build:
      context: .
      target: development
    environment:
      FASTAPI_DEBUG: "true"
      # Inside the Compose network the database is reachable as "mongo".
      # directConnection skips replica-set discovery, which would hand back
      # the member's own name, localhost:27017, meaning this container.
      # Transactions still work.
      DATABASE_URL: mongodb://mongo:27017/?directConnection=true
    volumes:
      # The project is mounted over the image's app directory, so edits on the
      # host reload the server. A .env file, if present, is read from here.
      - ./:/usr/src/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: >
        python -c "import urllib.request;
        urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:8
    # A single-node replica set. A standalone server has no transactions, and
    # the app needs them (e.g. a like and its counter change together).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # A replica set must be initiated once. The check does that on the first
      # run and reports healthy from then on. The member is named
      # localhost:27017 because that is the address used from the host.
      test: >
        mongosh --quiet --eval "
        try { rs.status().ok }
        catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
