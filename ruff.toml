line-length = 100
target-version = "py314"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "N",     # pep8-naming
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async
    "FAST",  # FastAPI-specific rules
    "S",     # flake8-bandit (security)
    "C90",   # mccabe complexity
]

[lint.per-file-ignores]
# In tests: asserts are the point, and passwords and tokens are test data.
"tests/**" = ["S101", "S105", "S106"]

[lint.mccabe]
max-complexity = 10

[lint.flake8-bugbear]
# Allow FastAPI's Depends/Query/etc. as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[format]
quote-style = "double"
docstring-code-format = true
